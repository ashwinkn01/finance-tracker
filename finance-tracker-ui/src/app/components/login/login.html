<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Sign In</mat-card-title>
      <mat-card-subtitle>Finance Tracker</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <!-- formControlName links this HTML input exactly to the TypeScript variable -->
          <input matInput formControlName="username" required>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
            Username is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" required>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <!-- The button is disabled automatically if the form is empty -->
        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="submit-button">
          Login
        </button>
        <div class="links" style="margin-top: 24px; text-align: center;">
          <a routerLink="/register" style="color: var(--mat-sys-primary); text-decoration: none;">Don't have an account? Register here</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
