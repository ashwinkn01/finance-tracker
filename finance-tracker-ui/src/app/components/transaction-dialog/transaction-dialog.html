<h2 mat-dialog-title>Add New Transaction</h2>

<mat-dialog-content>
  <form [formGroup]="transactionForm" class="dialog-form">
    
    <!-- Type Selection (Income vs Expense) -->
    <mat-form-field appearance="outline">
      <mat-label>Transaction Type</mat-label>
      <mat-select formControlName="type">
        <mat-option value="EXPENSE">Expense</mat-option>
        <mat-option value="INCOME">Income</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Amount Input -->
    <mat-form-field appearance="outline">
      <mat-label>Amount</mat-label>
      <span matTextPrefix>$&nbsp;</span>
      <input matInput type="number" formControlName="amount" placeholder="0.00">
    </mat-form-field>

    <!-- Date Picker -->
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="date">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- Category Input -->
    <mat-form-field appearance="outline">
      <mat-label>Category (e.g., Food, Rent, Salary)</mat-label>
      <input matInput formControlName="category">
    </mat-form-field>

    <!-- Description Input -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <input matInput formControlName="description">
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <!-- Disables the save button until the form is entirely filled out -->
  <button mat-flat-button color="primary" [disabled]="transactionForm.invalid" (click)="onSubmit()">Save</button>
</mat-dialog-actions>
