<div class="table-container">
  <mat-card>
    <mat-card-header class="table-header">
      <mat-card-title>All Transactions</mat-card-title>
      <button mat-flat-button color="primary" (click)="openAddDialog()">
        <mat-icon>add</mat-icon> Add Transaction
      </button>
    </mat-card-header>

    <mat-card-content>
      <!-- mat-elevation-z8 gives the table a nice floating shadow -->
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

          <!-- Date Column -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <!-- The DatePipe formats raw ISO strings into clean dates -->
            <td mat-cell *matCellDef="let txn"> {{ txn.date | date:'shortDate' }} </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
            <td mat-cell *matCellDef="let txn"> {{ txn.description }} </td>
          </ng-container>

          <!-- Category Column -->
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Category </th>
            <td mat-cell *matCellDef="let txn"> {{ txn.category }} </td>
          </ng-container>

          <!-- Amount Column -->
          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount </th>
            <td mat-cell *matCellDef="let txn"> 
              <!-- Dynamically apply CSS classes based on IN vs OUT -->
              <span [ngClass]="txn.type === 'EXPENSE' ? 'text-expense' : 'text-income'">
                {{ txn.type === 'EXPENSE' ? '-' : '+' }}{{ txn.amount | currency }} 
              </span>
            </td>
          </ng-container>

          <!-- Type Column -->
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Type </th>
            <td mat-cell *matCellDef="let txn"> {{ txn.type }} </td>
          </ng-container>

          <!-- Actions Column (Edit/Delete icons) -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let txn">
              <button mat-icon-button color="primary">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <!-- These two rows physically render the headers and the rows defined above -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <!-- The Pagination controls -->
        <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
